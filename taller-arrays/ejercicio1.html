<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de nombres</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 0 20px;
            line-height: 1.5;
            color: #222;
        }
        h1, h2 { color: #1a365d; }
        form { margin-bottom: 1.5rem; }
        input[type="text"] {
            padding: 8px 12px;
            font-size: 1rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            width: 220px;
        }
        button {
            padding: 8px 16px;
            font-size: 1rem;
            background: #2b6cb0;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover { background: #2c5282; }
        ul { padding-left: 1.4em; }
        #cantidad { font-weight: 600; margin-top: 1rem; }
        a { color: #2b6cb0; }
    </style>
</head>
<body>
    <h1>Registro de nombres</h1>

    <form id="formulario">
        <input type="text" id="nombre" placeholder="Ingrese un nombre">
        <button type="submit" id="btnAgregar">Agregar</button>
    </form>

    <h2>Personas registradas</h2>
    <ul id="lista"></ul>
    <p id="cantidad"></p>

    <p><a href="index.html">← Volver al menú</a></p>

    <script src="js/ejercicio1.js"></script>
</body>
</html>
