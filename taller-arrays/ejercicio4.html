<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de estudiantes</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 0 20px;
            line-height: 1.5;
            color: #222;
        }
        h1, h2 { color: #1a365d; }
        form { margin-bottom: 1.5rem; }
        input[type="text"] {
            padding: 8px 12px;
            font-size: 1rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            width: 220px;
        }
        button {
            padding: 8px 16px;
            font-size: 1rem;
            background: #2b6cb0;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover { background: #2c5282; }
        ul { padding-left: 1.4em; }
        #resultado {
            margin-top: 1rem;
            padding: 12px;
            border-radius: 6px;
            font-weight: 500;
        }
        .encontrado {
            background: #c6f6d5;
            color: #22543d;
            border: 1px solid #9ae6b4;
        }
        .no-encontrado {
            background: #fed7d7;
            color: #742a2a;
            border: 1px solid #feb2b2;
        }
        a { color: #2b6cb0; }
    </style>
</head>
<body>
    <h1>Buscador de estudiantes</h1>

    <h2>Estudiantes registrados</h2>
    <ul id="lista"></ul>

    <h2>Buscar estudiante</h2>
    <form id="formulario">
        <input type="text" id="busqueda" placeholder="Escribe un nombre">
        <button type="submit">Buscar</button>
    </form>

    <p id="resultado"></p>

    <p><a href="index.html">← Volver al menú</a></p>

    <script src="js/ejercicio4.js"></script>
</body>
</html>
