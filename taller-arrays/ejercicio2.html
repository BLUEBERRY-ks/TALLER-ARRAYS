<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de números</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 0 20px;
            line-height: 1.5;
            color: #222;
        }
        h1, h2 { color: #1a365d; }
        form { margin-bottom: 1.5rem; }
        input[type="number"] {
            padding: 8px 12px;
            font-size: 1rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            width: 180px;
        }
        button {
            padding: 8px 16px;
            font-size: 1rem;
            background: #2b6cb0;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover { background: #2c5282; }
        ul { padding-left: 1.4em; }
        #suma, #promedio, #mayor, #menor { margin: 0.3em 0; }
        a { color: #2b6cb0; }
    </style>
</head>
<body>
    <h1>Operaciones con arrays</h1>

    <form id="formulario">
        <input type="number" id="numero" placeholder="Ingrese un número" step="any">
        <button type="submit" id="btnAgregar">Agregar número</button>
    </form>

    <h2>Números registrados</h2>
    <ul id="lista"></ul>

    <h2>Resultados</h2>
    <p id="suma"></p>
    <p id="promedio"></p>
    <p id="mayor"></p>
    <p id="menor"></p>

    <p><a href="index.html">← Volver al menú</a></p>

    <script src="js/ejercicio2.js"></script>
</body>
</html>
